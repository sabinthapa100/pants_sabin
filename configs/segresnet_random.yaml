experiment:
  name: segresnet_random
  seed: 317

model:
  name: segresnet
  initialization: random
  pretrained_checkpoint: null
  in_channels: 1
  out_channels: 29
  init_filters: 16

training:
  epochs: 300
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.00001
  precision: auto
  patch_size: [96, 96, 96]
  num_samples_per_case: 2
  num_workers: 4

inference:
  patch_size: [96, 96, 96]
  overlap: 0.5
  sw_batch_size: 1

paths:
  data_root: ${PANTS_DATA_ROOT}
  output_root: ${PANTS_OUTPUT_ROOT}
