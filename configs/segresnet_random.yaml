# Control arm: the SAME 3D SegResNet trained from random initialization.
# Identical to segresnet_suprem.yaml in EVERY field except
# `model.initialization` and `model.pretrained_checkpoint`. Any other
# difference between these two files would confound the pretraining effect.
#
# NOTE: this file is a declarative provenance record. No code reads it yet;
# the trainer arrives in the next milestone. Paths marked `null` are supplied
# through environment variables (PANTS_DATA_ROOT) and are deliberately not
# interpolated here, because this repository has no config interpolation
# mechanism.

experiment:
  name: segresnet_random
  seed: 317

model:
  name: segresnet
  initialization: random
  pretrained_checkpoint: null
  in_channels: 1
  out_channels: 29
  init_filters: 16
  blocks_down: [1, 2, 2, 4]
  blocks_up: [1, 1, 1]

data:
  root: null                    # from $PANTS_DATA_ROOT
  manifest: splits/pants_tr_manifest_v1.json
  split: splits/pants_cv_v1.json
  fold: 0

preprocessing:
  orientation: RAS
  target_spacing_mm: [1.5, 1.5, 1.5]
  intensity_window_hu: [-175, 250]   # SuPreM supervised-pretraining domain
  intensity_range: [0.0, 1.0]
  spatial_flips: false          # PanTS has laterality-paired classes
  sampling_ratios_other_pancreas_lesion: [1, 2, 3]

training:
  epochs: 300
  batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  weight_decay: 0.00001
  precision: auto
  patch_size: [96, 96, 96]
  samples_per_case: 2
  num_workers: 4

inference:
  patch_size: [96, 96, 96]
  overlap: 0.5
  sw_batch_size: 1
